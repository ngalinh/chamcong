# ============================================================
# Nginx config cho zero-downtime blue-green deploy
# Apply 1 lần trên server (vmadmin@103.140.249.232)
# ============================================================
#
# Mục tiêu: 2 container Docker chạy song song:
#   - chamcong-a trên port 3000
#   - chamcong-b trên port 3001
# Deploy redeploy lần lượt → luôn có ít nhất 1 container live.
# Nginx tự failover khi 1 container restart.
#
# ─── Bước 1: tạo upstream block ─────────────────────────────
# Tạo file /etc/nginx/conf.d/chamcong-upstream.conf với nội dung:
#
upstream chamcong_app {
    # Hai container blue-green chạy song song.
    # max_fails=2 fail_timeout=10s: nginx mark fail sau 2 lỗi liên tiếp,
    # bỏ qua node fail trong 10s rồi thử lại.
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;

    # Keep-alive connection pool — giảm latency
    keepalive 16;
}

# ─── Bước 2: sửa file site /etc/nginx/sites-available/chamcong.conf ─
# Trong block `server { ... location / { ... } }`:
#
# THAY:
#   proxy_pass http://127.0.0.1:3000;
# BẰNG:
#   proxy_pass http://chamcong_app;
#
# Và THÊM vào trong location / { ... } để xử lý retry mượt khi 1 container đang restart:
#
#   proxy_next_upstream error timeout http_502 http_503 http_504;
#   proxy_next_upstream_tries 2;
#   proxy_next_upstream_timeout 10s;
#   proxy_connect_timeout 5s;
#   proxy_read_timeout 60s;
#
#   # Cần cho keep-alive upstream
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#
# ─── Bước 3: reload nginx ────────────────────────────────────
#   sudo nginx -t          # verify config OK
#   sudo systemctl reload nginx
#
# ─── Bước 4: trigger deploy ─────────────────────────────────
# Push commit mới hoặc chạy workflow_dispatch trên GitHub Actions.
# Lần deploy đầu sau thay đổi này:
#   - Container "chamcong" cũ (single-container) sẽ được xoá tự động.
#   - chamcong-a + chamcong-b được tạo mới.
# Các deploy tiếp theo: rolling redeploy 2 container, không downtime.
