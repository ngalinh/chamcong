name: Deploy to chamcong.basso.vn

on:
  push:
    branches: [main]
  workflow_dispatch:  # cho phép trigger thủ công từ GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true  # huỷ build cũ nếu push commit mới

jobs:
  # ----- Job 1: typecheck — chặn deploy nếu TS bị lỗi -----
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

  # ----- Job 2: deploy — blue-green rolling: redeploy lần lượt 2 container -----
  # Yêu cầu nginx config 1 lần (xem docs/nginx-blue-green.conf)
  deploy:
    name: Build & rolling restart
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR=/opt/chamcong
            IMAGE=chamcong:latest
            CONTAINER_A=chamcong-a
            CONTAINER_B=chamcong-b
            PORT_A=3000
            PORT_B=3001

            cd "$APP_DIR"

            echo "→ Pull code mới nhất từ main"
            git fetch --all --prune
            git reset --hard origin/main

            echo "→ Build Docker image (NEXT_PUBLIC_* qua build-arg)"
            set -a
            . ./.env
            set +a
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY \
              --build-arg NEXT_PUBLIC_FACE_MATCH_THRESHOLD \
              -t "$IMAGE" .

            # Migration: nếu còn container "chamcong" (single-container cũ), xoá
            if docker inspect chamcong > /dev/null 2>&1; then
              echo "→ Migrate: xoá container đơn 'chamcong' cũ"
              docker stop chamcong 2>/dev/null || true
              docker rm   chamcong 2>/dev/null || true
            fi

            # Function: redeploy 1 container — stop, remove, run, wait healthy
            redeploy() {
              local NAME=$1
              local PORT=$2
              echo "→ Redeploying $NAME (port $PORT)"
              docker stop "$NAME" 2>/dev/null || true
              docker rm   "$NAME" 2>/dev/null || true
              docker run -d \
                --name "$NAME" \
                --restart unless-stopped \
                -p "$PORT":3000 \
                --env-file .env \
                "$IMAGE"

              # Health check: poll /api/health max 60s
              echo "  …waiting for health"
              for i in $(seq 1 30); do
                if curl -fsS -o /dev/null --max-time 2 "http://127.0.0.1:$PORT/api/health"; then
                  echo "  ✓ $NAME healthy (sau ${i} lần thử)"
                  return 0
                fi
                sleep 2
              done
              echo "✗ $NAME không healthy sau 60s — abort deploy"
              docker logs "$NAME" --tail 50 || true
              exit 1
            }

            # Rolling redeploy: A trước, B sau.
            # Trong lúc A down, nginx auto-failover sang B (vẫn chạy version cũ).
            # Sau khi A xong → tới B, nginx auto-failover sang A (đã có version mới).
            redeploy "$CONTAINER_A" "$PORT_A"
            redeploy "$CONTAINER_B" "$PORT_B"

            echo "→ Cleanup image cũ không dùng"
            docker image prune -f

            echo "✓ Deploy xong. Containers đang chạy:"
            docker ps --filter "name=chamcong" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
